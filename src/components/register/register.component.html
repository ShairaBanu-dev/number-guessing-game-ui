<h2>Register</h2>
<form (submit)="register(); $event.preventDefault()">
  <label>Username:</label>
  <input type="text" [(ngModel)]="username" name="username" required>

  <label>Password:</label>
  <input type="password" [(ngModel)]="password" name="password" required>

  <!-- Disable button if username or password is empty -->
  <button type="submit" [disabled]="!username || !password">Register</button>
</form>
<p>Already have an account? <a routerLink="/login" routerLinkActive="active">Login Here</a></p>
